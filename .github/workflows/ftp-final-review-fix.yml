name: FTP final review fix one shot

on:
  push:
    branches:
      - ftp-evidence-integration
    paths:
      - ".github/workflows/ftp-final-review-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ftp-evidence-integration
          fetch-depth: 0

      - name: Apply final review hardening
        run: python3 .github/scripts/ftp-final-review-fix.py

      - name: Validate hardened FTP normalizer
        run: |
          node --check scripts/normalize-ftp-evidence.mjs
          node --check scripts/test-ftp-observation-bundle.mjs
          node scripts/test-ftp-observation-bundle.mjs
          node scripts/normalize-ftp-evidence.mjs \
            --input scripts/fixtures/ftp-projection-sanitized.json \
            --output /tmp/ftp-observation-bundle.json

      - name: Commit fixes and remove temporary patcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/ftp-final-review-fix.yml .github/scripts/ftp-final-review-fix.py
          git add -A
          git commit -m "Phase FTP: close final review gaps"
          git push origin HEAD:ftp-evidence-integration
