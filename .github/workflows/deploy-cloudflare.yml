name: Deploy Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy MW Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect D1 migration changes
        id: migrations
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
            echo "Manual deployment: remote migration gate remains enabled."
            exit 0
          fi

          if [[ -z "${BEFORE_SHA:-}" || "${BEFORE_SHA}" =~ ^0+$ ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
            echo "No reliable previous commit: remote migration gate remains enabled."
            exit 0
          fi

          if git diff --quiet "${BEFORE_SHA}" "${CURRENT_SHA}" -- migrations/; then
            echo "apply=false" >> "$GITHUB_OUTPUT"
            echo "No migration files changed in this push; remote D1 migration read is skipped."
          else
            echo "apply=true" >> "$GITHUB_OUTPUT"
            echo "Migration files changed; remote D1 migration gate is required before Worker deployment."
          fi

      - name: Install dependencies
        run: npm install

      - name: Prepare browser import runtime
        run: npm run prepare:import-runtime

      - name: Type check
        run: npm run check

      # Additive schema changes must exist before a Worker version that queries
      # them can receive traffic. When no migration changed, querying the remote
      # D1 migration ledger is unnecessary row-read work and is intentionally
      # skipped. Manual deployments retain the gate so operators can explicitly
      # reconcile schema state.
      - name: Apply D1 migrations
        if: steps.migrations.outputs.apply == 'true'
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Confirm unchanged D1 schema
        if: steps.migrations.outputs.apply != 'true'
        run: echo "D1 migrations unchanged; continuing without a remote migration-ledger read."

      - name: Deploy Worker and provision bindings
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # ADMIN_IMPORT_TOKEN is sourced from repository secrets only. Do not attach
      # this job to a GitHub Environment with an identically named secret because
      # environment secrets would shadow the repository value used by the operator.
      - name: Sync optional semantic import secret
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_IMPORT_TOKEN: ${{ secrets.ADMIN_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${ADMIN_IMPORT_TOKEN:-}" ]]; then
            printf '%s' "$ADMIN_IMPORT_TOKEN" | npx wrangler secret put ADMIN_IMPORT_TOKEN
            echo "ADMIN_IMPORT_TOKEN synchronized to Cloudflare Worker."
          else
            echo "ADMIN_IMPORT_TOKEN is not configured; semantic publishing remains disabled."
          fi

      # Prove that the exact repository secret resolves through the deployed
      # Worker auth boundary without printing or otherwise exposing the token.
      - name: Smoke test semantic import authorization
        shell: bash
        env:
          ADMIN_IMPORT_TOKEN: ${{ secrets.ADMIN_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${ADMIN_IMPORT_TOKEN:-}" ]]; then
            response="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 \
              -H "Authorization: Bearer ${ADMIN_IMPORT_TOKEN}" \
              https://mw-dashboard.saeedm309.workers.dev/api/v2/import/sources)"
            printf '%s\n' "$response"
            printf '%s\n' "$response" | grep -Fq '"sources"'
            echo "Deployed semantic import authorization accepted the repository secret."
          else
            echo "ADMIN_IMPORT_TOKEN is not configured; authorization smoke test skipped."
          fi

      - name: Smoke test deployed health endpoint
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 https://mw-dashboard.saeedm309.workers.dev/health)"
          printf '%s\n' "$response"
          printf '%s\n' "$response" | grep -Fq '"status": "ok"'

      - name: Smoke test semantic import status
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 https://mw-dashboard.saeedm309.workers.dev/api/v2/import/status)"
          printf '%s\n' "$response"
          printf '%s\n' "$response" | grep -Fq '"database_ready": true'

      - name: Smoke test canonical estate status
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 https://mw-dashboard.saeedm309.workers.dev/api/v2/estate/status)"
          printf '%s\n' "$response"
          printf '%s\n' "$response" | grep -Fq '"database_ready": true'

      - name: Smoke test operational findings status
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 https://mw-dashboard.saeedm309.workers.dev/api/v2/operations/status)"
          printf '%s\n' "$response"
          printf '%s\n' "$response" | grep -Fq '"database_ready": true'
          printf '%s\n' "$response" | grep -Fq '"schema_version": "osi.operations.read/v1"'
