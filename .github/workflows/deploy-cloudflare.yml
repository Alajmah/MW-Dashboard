name: Deploy Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy MW Dashboard
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: npm install

      - name: Prepare browser import runtime
        run: npm run prepare:import-runtime

      - name: Type check
        run: npm run check

      - name: Deploy Worker and provision bindings
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test deployed health endpoint
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 https://mw-dashboard.saeedm309.workers.dev/health)"
          printf '%s\n' "$response"
          printf '%s\n' "$response" | grep -Fq '"status": "ok"'

      - name: Smoke test semantic import status
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 https://mw-dashboard.saeedm309.workers.dev/api/v2/import/status)"
          printf '%s\n' "$response"
          printf '%s\n' "$response" | grep -Fq '"database_ready": true'
