name: FTP review fix (one shot)

on:
  push:
    branches:
      - ftp-evidence-integration
    paths:
      - ".github/workflows/ftp-review-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ftp-evidence-integration
          fetch-depth: 0

      - name: Apply review hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          p = Path("scripts/normalize-ftp-evidence.mjs")
          s = p.read_text()

          s = replace_once(s, "const ADAPTER_VERSION = '0.2.0';", "const ADAPTER_VERSION = '0.3.0';", "adapter version")

          s = replace_once(
              s,
              "function stableStringify(value) { return JSON.stringify(canonicalize(value)); }\n"
              "function sortByKey(items) { return [...items].sort((a, b) => String(a?.key ?? '').localeCompare(String(b?.key ?? ''))); }\n",
              "function stableStringify(value) { return JSON.stringify(canonicalize(value)); }\n"
              "function sortByKey(items) { return [...items].sort((a, b) => String(a?.key ?? '').localeCompare(String(b?.key ?? ''))); }\n"
              "function sortStable(items) { return [...items].map(canonicalize).sort((a, b) => stableStringify(a).localeCompare(stableStringify(b))); }\n"
              "function canonicalRoutesForFingerprint(routes) {\n"
              "  return sortByKey(routes).map(route => {\n"
              "    const copy = structuredClone(route);\n"
              "    if (copy?.pnc && Array.isArray(copy.pnc.corroboration)) copy.pnc.corroboration = sortStable(copy.pnc.corroboration);\n"
              "    return copy;\n"
              "  });\n"
              "}\n",
              "fingerprint helpers",
          )

          s = replace_once(
              s,
              "  unresolved(sourceRef, semanticType, state, evidenceClass, properties={}) {\n"
              "    if (!this.entityType.has(sourceRef)) fail(`unresolved source endpoint missing: ${semanticType}`);\n"
              "    const normalizedProperties = canonicalize(properties);\n"
              "    const ref = stableRef('unr', sourceRef, semanticType, state, stableStringify(normalizedProperties));\n"
              "    this.bundle.unresolved_references.push({\n"
              "      ref,\n"
              "      source_ref: sourceRef,\n"
              "      semantic_type: semanticType,\n"
              "      state,\n"
              "      evidence_class: evidenceClass,\n"
              "      properties: normalizedProperties,\n"
              "    });\n"
              "    return ref;\n"
              "  }\n",
              "  unresolved(sourceRef, semanticType, state, evidenceClass, reason, properties={}) {\n"
              "    if (!this.entityType.has(sourceRef)) fail(`unresolved source endpoint missing: ${semanticType}`);\n"
              "    if (typeof reason !== 'string' || !reason.trim()) fail(`unresolved ${semanticType} reason is required`);\n"
              "    const normalizedReason = reason.trim();\n"
              "    const normalizedProperties = canonicalize(properties);\n"
              "    const ref = stableRef('unr', sourceRef, semanticType, state, normalizedReason, stableStringify(normalizedProperties));\n"
              "    this.bundle.unresolved_references.push({\n"
              "      ref,\n"
              "      source_ref: sourceRef,\n"
              "      semantic_type: semanticType,\n"
              "      state,\n"
              "      evidence_class: evidenceClass,\n"
              "      reason: normalizedReason,\n"
              "      properties: normalizedProperties,\n"
              "    });\n"
              "    return ref;\n"
              "  }\n",
              "unresolved reason contract",
          )

          s = replace_once(s, "    routes: sortByKey(routes),", "    routes: canonicalRoutesForFingerprint(routes),", "nested fingerprint canonicalization")
          s = replace_once(s, "      projection_profile: 'eft-dmz-mft/current-topology-v2',", "      projection_profile: 'eft-dmz-mft/current-topology-v3',", "projection profile")
          s = replace_once(
              s,
              "      epistemic_policy: 'current Site/listener/PNC observations may be composed with historical Site-access evidence only as an inferred topology route; completed file transfer remains unproven',",
              "      epistemic_policy: 'current started-Site/listener observations may be composed with historical Site-access evidence only as an inferred topology route; PNC qualification requires provenance-bearing current runtime corroboration from at least two distinct source kinds; completed file transfer remains unproven',",
              "epistemic policy",
          )

          s = replace_once(
              s,
              "    const site = siteByKey.get(route.site_key);\n"
              "    if (!site) fail(`route ${route.key} references unknown site ${route.site_key}`);\n"
              "    const gateway = serverByKey.get(route.gateway_server_key);",
              "    const site = siteByKey.get(route.site_key);\n"
              "    if (!site) fail(`route ${route.key} references unknown site ${route.site_key}`);\n"
              "    if (site.status !== 'started') fail(`route ${route.key} cannot qualify Site ${site.name} unless status=started`);\n"
              "    if (site.listener_resolution !== 'resolved') fail(`route ${route.key} cannot qualify Site ${site.name} unless listener_resolution=resolved`);\n"
              "    const gateway = serverByKey.get(route.gateway_server_key);",
              "stopped/unresolved Site route guard",
          )

          old_pnc = """    requireCurrentObserved(route.pnc, `route ${route.key} PNC`);
    const pncEvidenceRef = requireEvidence(route.pnc, `route ${route.key} PNC`);
    if (!route.pnc?.host) fail(`route ${route.key} PNC host is required`);
    requirePort(route.pnc?.port, `route ${route.key} PNC port`);
    if (route.pnc.independently_corroborated !== true) fail(`route ${route.key} requires independently corroborated PNC connectivity`);
    const pncCorroborationRefs = uniqStrings(route.pnc.corroboration_evidence_refs);
    if (pncCorroborationRefs.length < 2) fail(`route ${route.key} PNC requires at least two distinct corroboration_evidence_refs`);
    if (!pncCorroborationRefs.includes(pncEvidenceRef)) fail(`route ${route.key} PNC evidence_ref must be included in corroboration_evidence_refs`);
    if (pncCorroborationRefs.includes(siteAccessEvidenceRef)) fail(`route ${route.key} PNC corroboration must be independent of Site-access evidence`);
"""
          new_pnc = """    requireCurrentObserved(route.pnc, `route ${route.key} PNC`);
    const pncEvidenceRef = requireEvidence(route.pnc, `route ${route.key} PNC`);
    if (!route.pnc?.host) fail(`route ${route.key} PNC host is required`);
    requirePort(route.pnc?.port, `route ${route.key} PNC port`);
    if (route.pnc.independently_corroborated !== true) fail(`route ${route.key} requires independently corroborated PNC connectivity`);
    if (!Array.isArray(route.pnc.corroboration) || route.pnc.corroboration.length < 2) {
      fail(`route ${route.key} PNC requires at least two provenance-bearing corroboration records`);
    }
    const pncCorroboration = route.pnc.corroboration.map((item, index) => {
      const label = `route ${route.key} PNC corroboration[${index}]`;
      requireCurrentObserved(item, label);
      const evidenceRef = requireEvidence(item, label);
      if (item.kind !== 'pnc_runtime_connectivity') fail(`${label} kind must be pnc_runtime_connectivity`);
      if (typeof item.source_kind !== 'string' || !item.source_kind.trim()) fail(`${label} source_kind is required`);
      if (item.endpoint_host !== route.pnc.host) fail(`${label} endpoint_host must match route PNC host`);
      requirePort(item.endpoint_port, `${label} endpoint_port`);
      if (item.endpoint_port !== route.pnc.port) fail(`${label} endpoint_port must match route PNC port`);
      if (evidenceRef === siteAccessEvidenceRef) fail(`route ${route.key} PNC corroboration must be independent of Site-access evidence`);
      return canonicalize({
        kind: 'pnc_runtime_connectivity',
        source_kind: item.source_kind.trim(),
        time_scope: 'current',
        evidence_class: 'observed',
        evidence_ref: evidenceRef,
        endpoint_host: route.pnc.host,
        endpoint_port: route.pnc.port,
      });
    }).sort((a,b)=>stableStringify(a).localeCompare(stableStringify(b)));
    const pncCorroborationRefs = uniqStrings(pncCorroboration.map(item => item.evidence_ref)).sort();
    const pncSourceKinds = uniqStrings(pncCorroboration.map(item => item.source_kind)).sort();
    if (pncCorroborationRefs.length < 2) fail(`route ${route.key} PNC requires at least two distinct runtime evidence refs`);
    if (pncSourceKinds.length < 2) fail(`route ${route.key} PNC requires at least two distinct runtime source kinds`);
    if (!pncCorroborationRefs.includes(pncEvidenceRef)) fail(`route ${route.key} PNC evidence_ref must be represented by a corroboration record`);
"""
          s = replace_once(s, old_pnc, new_pnc, "PNC provenance validation")

          s = replace_once(
              s,
              "          evidence_refs: [...pncCorroborationRefs].sort(),\n"
              "        }],",
              "          evidence_refs: [...pncCorroborationRefs],\n"
              "          sources: pncCorroboration,\n"
              "        }],",
              "PNC route provenance emission",
          )

          old_flow = """        evidence_refs: [...pncCorroborationRefs].sort(),
        runtime_transfer_completion: false,
      },
    });
    b.relation('network.connects_to', pncFlow, pnc.networkRef, generatedAt, 'observed', {
      evidenceRef: pncEvidenceRef,
      properties: {
        role: 'peer_notification_channel',
        independently_corroborated: true,
        evidence_refs: [...pncCorroborationRefs].sort(),
        runtime_transfer_completion: false,
"""
          new_flow = """        evidence_refs: [...pncCorroborationRefs],
        corroboration_sources: pncCorroboration,
        runtime_transfer_completion: false,
      },
    });
    b.relation('network.connects_to', pncFlow, pnc.networkRef, generatedAt, 'observed', {
      evidenceRef: pncEvidenceRef,
      properties: {
        role: 'peer_notification_channel',
        independently_corroborated: true,
        evidence_refs: [...pncCorroborationRefs],
        corroboration_sources: pncCorroboration,
        runtime_transfer_completion: false,
"""
          s = replace_once(s, old_flow, new_flow, "PNC flow/relation provenance emission")

          old_unresolved = """    const siteRef = siteRefs.get(site.key);
    b.unresolved(siteRef, 'filetransfer.endpoint', 'unresolved', 'observed', {
      unresolved_kind: 'site_listener_mapping',
      site_name: site.name,
      reason: gaps.find(g => g.site_key === site.key)?.reason ?? 'No current listener/gateway mapping is supported by the supplied evidence.',
    });
"""
          new_unresolved = """    const siteRef = siteRefs.get(site.key);
    const reason = gaps.find(g => g.site_key === site.key)?.reason
      ?? 'No current listener/gateway mapping is supported by the supplied evidence.';
    b.unresolved(siteRef, 'filetransfer.endpoint', 'unresolved', 'observed', reason, {
      unresolved_kind: 'site_listener_mapping',
      site_name: site.name,
      reason,
    });
"""
          s = replace_once(s, old_unresolved, new_unresolved, "top-level unresolved reason")

          old_validate = """  for (const unresolved of bundle.unresolved_references) {
    if (!refs.has(unresolved.source_ref)) fail(`unresolved source endpoint missing ${unresolved.ref}`);
    if (unresolved.state !== 'unresolved') fail(`unsupported unresolved state ${unresolved.state}`);
  }
"""
          new_validate = """  for (const unresolved of bundle.unresolved_references) {
    if (!refs.has(unresolved.source_ref)) fail(`unresolved source endpoint missing ${unresolved.ref}`);
    if (unresolved.state !== 'unresolved') fail(`unsupported unresolved state ${unresolved.state}`);
    if (typeof unresolved.reason !== 'string' || !unresolved.reason.trim()) fail(`unresolved reason missing ${unresolved.ref}`);
  }
"""
          s = replace_once(s, old_validate, new_validate, "unresolved validator")

          old_route_validate = """      if (!Array.isArray(pnc.evidence_refs) || new Set(pnc.evidence_refs).size < 2) fail('FTP route PNC corroboration requires at least two evidence refs');
"""
          new_route_validate = """      if (!Array.isArray(pnc.sources) || pnc.sources.length < 2) fail('FTP route PNC corroboration requires provenance-bearing sources');
      const sourceKinds = new Set();
      const pncEvidenceRefs = new Set();
      for (const source of pnc.sources) {
        if (source?.kind !== 'pnc_runtime_connectivity') fail('FTP route PNC source kind is invalid');
        if (source?.time_scope !== 'current' || source?.evidence_class !== 'observed') fail('FTP route PNC source provenance is invalid');
        if (!source?.source_kind || !source?.evidence_ref) fail('FTP route PNC source metadata is incomplete');
        sourceKinds.add(source.source_kind);
        pncEvidenceRefs.add(source.evidence_ref);
      }
      if (sourceKinds.size < 2 || pncEvidenceRefs.size < 2) fail('FTP route PNC corroboration is not independent');
"""
          s = replace_once(s, old_route_validate, new_route_validate, "PNC output validator")
          p.write_text(s)

          fp = Path("scripts/fixtures/ftp-projection-sanitized.json")
          fixture = json.loads(fp.read_text())
          for route in fixture["routes"]:
              pnc = route["pnc"]
              refs = pnc.pop("corroboration_evidence_refs")
              if len(refs) != 2:
                  raise SystemExit(f"fixture {route['key']}: expected two PNC refs")
              pnc["corroboration"] = [
                  {
                      "kind": "pnc_runtime_connectivity",
                      "source_kind": "dmz_gateway_runtime",
                      "time_scope": "current",
                      "evidence_class": "observed",
                      "evidence_ref": refs[0],
                      "endpoint_host": pnc["host"],
                      "endpoint_port": pnc["port"],
                  },
                  {
                      "kind": "pnc_runtime_connectivity",
                      "source_kind": "eft_runtime",
                      "time_scope": "current",
                      "evidence_class": "observed",
                      "evidence_ref": refs[1],
                      "endpoint_host": pnc["host"],
                      "endpoint_port": pnc["port"],
                  },
              ]
          fp.write_text(json.dumps(fixture, indent=2) + "\n")

          tp = Path("scripts/test-ftp-observation-bundle.mjs")
          t = tp.read_text()
          t = replace_once(t, "assert(first.run.collector_version === '0.2.0', 'wrong adapter version');",
                              "assert(first.run.collector_version === '0.3.0', 'wrong adapter version');", "test adapter version")
          t = replace_once(
              t,
              "assert(first.unresolved_references.every(x=>x.state==='unresolved' && x.properties?.unresolved_kind==='site_listener_mapping'), 'unresolved Site mappings are malformed');",
              "assert(first.unresolved_references.every(x=>x.state==='unresolved' && x.properties?.unresolved_kind==='site_listener_mapping'), 'unresolved Site mappings are malformed');\n"
              "assert(first.unresolved_references.every(x=>typeof x.reason==='string' && x.reason.length>0), 'unresolved reasons are not emitted in the import-contract field');\n"
              "assert(first.unresolved_references.some(x=>x.reason.includes('historical activity')), 'gap-specific unresolved reason was lost');",
              "test unresolved reason",
          )
          old_pnc_asserts = """  assert(Array.isArray(pnc.evidence_refs) && new Set(pnc.evidence_refs).size >= 2, 'PNC corroboration lacks two independent evidence refs');
  assert(!pnc.evidence_refs.includes(route.properties.site_access_evidence.evidence_ref), 'PNC evidence reuses the historical Site-access evidence');
"""
          new_pnc_asserts = """  assert(Array.isArray(pnc.sources) && pnc.sources.length >= 2, 'PNC provenance-bearing sources missing');
  assert(new Set(pnc.sources.map(x=>x.source_kind)).size >= 2, 'PNC sources are not independent by source kind');
  assert(new Set(pnc.sources.map(x=>x.evidence_ref)).size >= 2, 'PNC sources are not independent by evidence ref');
  assert(pnc.sources.every(x=>x.kind==='pnc_runtime_connectivity'), 'non-PNC evidence was admitted as PNC corroboration');
  assert(pnc.sources.every(x=>x.time_scope==='current' && x.evidence_class==='observed'), 'PNC source provenance was flattened');
  assert(!pnc.sources.some(x=>x.evidence_ref===route.properties.site_access_evidence.evidence_ref), 'PNC evidence reuses the historical Site-access evidence');
"""
          t = replace_once(t, old_pnc_asserts, new_pnc_asserts, "test PNC provenance assertions")
          old_negative = """const badPnc = clone(fixture);
badPnc.routes[0].pnc.independently_corroborated = false;
assert(rejectedWith(badPnc, /independently corroborated PNC/), 'uncorroborated PNC route was accepted');

const onePncSource = clone(fixture);
onePncSource.routes[0].pnc.corroboration_evidence_refs = ['ev:pnc-a1-dmz'];
assert(rejectedWith(onePncSource, /at least two distinct corroboration_evidence_refs/), 'single-source PNC evidence was accepted as independent corroboration');

const reusedSiteAccess = clone(fixture);
reusedSiteAccess.routes[0].pnc.corroboration_evidence_refs = ['ev:pnc-a1-dmz', 'ev:site-access-external-user'];
assert(rejectedWith(reusedSiteAccess, /independent of Site-access evidence/), 'PNC corroboration reused Site-access evidence');

const historicalPnc = clone(fixture);
historicalPnc.routes[0].pnc.time_scope = 'historical';
assert(rejectedWith(historicalPnc, /PNC must set time_scope=current/), 'historical PNC evidence was promoted to current runtime corroboration');
"""
          new_negative = """const stoppedSite = clone(fixture);
stoppedSite.sites.find(x=>x.key==='site-external-user').status = 'stopped';
assert(rejectedWith(stoppedSite, /unless status=started/), 'stopped Site was exposed as a qualified route');

const badPnc = clone(fixture);
badPnc.routes[0].pnc.independently_corroborated = false;
assert(rejectedWith(badPnc, /independently corroborated PNC/), 'uncorroborated PNC route was accepted');

const onePncSource = clone(fixture);
onePncSource.routes[0].pnc.corroboration = [onePncSource.routes[0].pnc.corroboration[0]];
assert(rejectedWith(onePncSource, /at least two provenance-bearing corroboration records/), 'single-source PNC evidence was accepted as independent corroboration');

const duplicatePncSourceKind = clone(fixture);
duplicatePncSourceKind.routes[0].pnc.corroboration[1].source_kind = duplicatePncSourceKind.routes[0].pnc.corroboration[0].source_kind;
assert(rejectedWith(duplicatePncSourceKind, /at least two distinct runtime source kinds/), 'same-kind evidence was accepted as independent PNC corroboration');

const listenerMasqueradingAsPnc = clone(fixture);
listenerMasqueradingAsPnc.routes[0].pnc.corroboration[1].kind = 'listener_runtime_state';
listenerMasqueradingAsPnc.routes[0].pnc.corroboration[1].evidence_ref = listenerMasqueradingAsPnc.routes[0].listener.evidence_ref;
assert(rejectedWith(listenerMasqueradingAsPnc, /kind must be pnc_runtime_connectivity/), 'listener evidence was accepted as PNC corroboration');

const reusedSiteAccess = clone(fixture);
reusedSiteAccess.routes[0].pnc.corroboration[1].evidence_ref = reusedSiteAccess.routes[0].site_access.evidence_ref;
assert(rejectedWith(reusedSiteAccess, /independent of Site-access evidence/), 'PNC corroboration reused Site-access evidence');

const historicalPnc = clone(fixture);
historicalPnc.routes[0].pnc.corroboration[1].time_scope = 'historical';
assert(rejectedWith(historicalPnc, /must set time_scope=current/), 'historical PNC evidence was promoted to current runtime corroboration');
"""
          t = replace_once(t, old_negative, new_negative, "test negative PNC/stopped Site cases")
          old_reordered = """const reordered = clone(fixture);
for (const name of ['hosts','servers','sites','routes','storage_paths','mft_agents','gaps']) reordered[name].reverse();
const reorderedBundle = normalizeProjection(reordered);
assert(reorderedBundle.run.run_id === first.run.run_id, 'run_id changed only because top-level keyed arrays were reordered');
assert(JSON.stringify(reorderedBundle) === JSON.stringify(first), 'bundle bytes changed only because top-level keyed arrays were reordered');
"""
          new_reordered = """const reordered = clone(fixture);
for (const name of ['hosts','servers','sites','routes','storage_paths','mft_agents','gaps']) reordered[name].reverse();
for (const route of reordered.routes) route.pnc.corroboration.reverse();
const reorderedBundle = normalizeProjection(reordered);
assert(reorderedBundle.run.run_id === first.run.run_id, 'run_id changed only because set-like arrays were reordered');
assert(JSON.stringify(reorderedBundle) === JSON.stringify(first), 'bundle bytes changed only because set-like arrays were reordered');

const nestedOnlyReordered = clone(fixture);
nestedOnlyReordered.routes[0].pnc.corroboration.reverse();
const nestedOnlyBundle = normalizeProjection(nestedOnlyReordered);
assert(nestedOnlyBundle.run.run_id === first.run.run_id, 'run_id changed because nested PNC corroboration order changed');
assert(JSON.stringify(nestedOnlyBundle) === JSON.stringify(first), 'bundle bytes changed because nested PNC corroboration order changed');
"""
          t = replace_once(t, old_reordered, new_reordered, "test nested fingerprint canonicalization")
          tp.write_text(t)

          dp = Path("docs/phase-ftp-evidence-integration.md")
          d = dp.read_text()
          d = replace_once(
              d,
              "The normalizer fails closed if a route does not include an independently corroborated PNC endpoint.",
              "The normalizer fails closed unless PNC corroboration contains at least two current observed `pnc_runtime_connectivity` records with distinct `source_kind` values and evidence references for the same PNC endpoint. Opaque evidence-ref counts alone are insufficient.",
              "documentation PNC provenance",
          )
          dp.write_text(d)
          PY

      - name: Validate hardened FTP normalizer
        shell: bash
        run: |
          node --check scripts/normalize-ftp-evidence.mjs
          node --check scripts/test-ftp-observation-bundle.mjs
          node scripts/test-ftp-observation-bundle.mjs
          node scripts/normalize-ftp-evidence.mjs \
            --input scripts/fixtures/ftp-projection-sanitized.json \
            --output /tmp/ftp-observation-bundle.json

      - name: Commit review fixes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ftp-review-fix.yml
          git add scripts/normalize-ftp-evidence.mjs \
                  scripts/test-ftp-observation-bundle.mjs \
                  scripts/fixtures/ftp-projection-sanitized.json \
                  docs/phase-ftp-evidence-integration.md
          git commit -m "Phase FTP: harden review provenance boundaries"
          git push origin HEAD:ftp-evidence-integration
