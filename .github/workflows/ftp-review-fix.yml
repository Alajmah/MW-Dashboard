name: FTP review fix one shot

on:
  push:
    branches:
      - ftp-evidence-integration
    paths:
      - ".github/workflows/ftp-review-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ftp-evidence-integration
          fetch-depth: 0

      - name: Repair patch substitutions
        run: python3 .github/scripts/repair-ftp-review-fix.py

      - name: Apply review hardening
        run: python3 .github/scripts/ftp-review-fix.py

      - name: Validate hardened FTP normalizer
        run: |
          node --check scripts/normalize-ftp-evidence.mjs
          node --check scripts/test-ftp-observation-bundle.mjs
          node scripts/test-ftp-observation-bundle.mjs
          node scripts/normalize-ftp-evidence.mjs --input scripts/fixtures/ftp-projection-sanitized.json --output /tmp/ftp-observation-bundle.json

      - name: Commit review fixes and remove temporary patchers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ftp-review-fix.yml .github/scripts/ftp-review-fix.py .github/scripts/repair-ftp-review-fix.py
          git add scripts/normalize-ftp-evidence.mjs scripts/test-ftp-observation-bundle.mjs scripts/fixtures/ftp-projection-sanitized.json docs/phase-ftp-evidence-integration.md
          git commit -m "Phase FTP: harden review provenance boundaries"
          git push origin HEAD:ftp-evidence-integration

# retry after Site-resolution guard correction
