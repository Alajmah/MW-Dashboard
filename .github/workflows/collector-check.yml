name: IBM MQ collector check

on:
  pull_request:
    paths:
      - "collectors/ibm-mq/**"
      - "docs/mq-raw-collector-contract-v1.md"
      - ".github/workflows/collector-check.yml"
  push:
    branches:
      - main
    paths:
      - "collectors/ibm-mq/**"
      - "docs/mq-raw-collector-contract-v1.md"
      - ".github/workflows/collector-check.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Bash syntax check
        run: bash -n collectors/ibm-mq/mq-topology-collector.sh

      - name: Python syntax check
        run: python3 -m py_compile collectors/ibm-mq/normalize_mq_topology.py

      - name: Help path
        run: |
          bash collectors/ibm-mq/mq-topology-collector.sh --help >/dev/null
          python3 collectors/ibm-mq/normalize_mq_topology.py --help >/dev/null

      - name: Mocked archive integration test
        shell: bash
        run: |
          set -euo pipefail
          mockbin="$(mktemp -d)"
          outdir="$(mktemp -d)"

          cat > "$mockbin/dspmq" <<'EOF'
          #!/usr/bin/env bash
          echo 'QMNAME(QM_EXT) STATUS(Running)'
          echo 'QMNAME(QM_INT) STATUS(Running elsewhere)'
          EOF

          cat > "$mockbin/runmqsc" <<'EOF'
          #!/usr/bin/env bash
          qmgr="$1"
          echo "Starting MQSC for queue manager $qmgr."
          while IFS= read -r command; do
            echo "     1 : $command"
            case "$command" in
              'DISPLAY QMGR ALL')
                echo 'AMQ8408I: Display Queue Manager details.'
                echo "   QMNAME($qmgr) PLATFORM(UNIX) CMDLEVEL(940) VERSION(09040000)"
                ;;
              'DISPLAY QLOCAL(*) ALL')
                echo 'AMQ8409I: Display Queue details.'
                echo '   QUEUE(APP.REQUEST) TYPE(QLOCAL) USAGE(NORMAL) PUT(ENABLED) GET(ENABLED)'
                ;;
              'DISPLAY CHANNEL(*) ALL')
                echo 'AMQ8414I: Display Channel details.'
                echo "   CHANNEL(APP.$qmgr) CHLTYPE(SVRCONN) MCAUSER(appuser)"
                ;;
              'DISPLAY CONN(*) TYPE(CONN) ALL')
                echo 'AMQ8276I: Display Connection details.'
                echo '   CONN(ABC123) TYPE(CONN) APPLTAG(MockApp) APPLTYPE(USER)'
                echo "   CHANNEL(APP.$qmgr) CONNAME(10.0.0.10) USERID(appuser)"
                ;;
              'DISPLAY QSTATUS(*) TYPE(HANDLE) ALL')
                echo 'AMQ8450I: Display queue status details.'
                echo '   QUEUE(APP.REQUEST) TYPE(HANDLE) APPLTAG(MockApp) APPLTYPE(USER)'
                echo "   CHANNEL(APP.$qmgr) CONNAME(10.0.0.10) INPUT(SHARED) OUTPUT(NO) USERID(appuser)"
                ;;
            esac
          done
          EOF

          cat > "$mockbin/dspmqver" <<'EOF'
          #!/usr/bin/env bash
          echo 'Name: IBM MQ'
          echo 'Version: 9.4.0.0'
          EOF

          chmod +x "$mockbin"/*
          PATH="$mockbin:$PATH" bash collectors/ibm-mq/mq-topology-collector.sh 2 0 --output-dir "$outdir"

          archive="$(find "$outdir" -maxdepth 1 -name 'mq-topology-*.tar.gz' -print -quit)"
          test -n "$archive"

          listing="$(tar -tzf "$archive")"
          grep -q 'manifest.properties' <<<"$listing"
          grep -q 'qmgrs.tsv' <<<"$listing"
          grep -q 'qmgr/001_QM_EXT/config/channels.out' <<<"$listing"
          grep -q 'runtime/sample_001_.*connections.out' <<<"$listing"
          grep -q 'runtime/sample_002_.*connection-handles.out' <<<"$listing"

          python3 collectors/ibm-mq/normalize_mq_topology.py "$archive" -o "$outdir/normalized.json"
          python3 - "$outdir/normalized.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          ids={node['id'] for node in data['nodes']}
          assert len(ids)==len(data['nodes'])
          assert all(edge['source'] in ids and edge['target'] in ids for edge in data['edges'])
          assert any(node['type']=='qmgr' and node['name']=='QM_EXT' for node in data['nodes'])
          assert any(node['type']=='application' and node['name']=='MockApp' for node in data['nodes'])
          assert any(edge['relationship']=='CONSUMED_BY' for edge in data['edges'])
          PY
