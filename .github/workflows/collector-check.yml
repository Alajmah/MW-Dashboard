name: IBM MQ collector check

on:
  pull_request:
    paths:
      - "collectors/ibm-mq/**"
      - "services/core/registry/v1.json"
      - "docs/mq-raw-collector-contract-v1.md"
      - ".github/workflows/collector-check.yml"
  push:
    branches:
      - main
    paths:
      - "collectors/ibm-mq/**"
      - "services/core/registry/v1.json"
      - "docs/mq-raw-collector-contract-v1.md"
      - ".github/workflows/collector-check.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Bash syntax check
        run: bash -n collectors/ibm-mq/mq-topology-collector.sh

      - name: Python syntax check
        run: |
          python3 -m py_compile collectors/ibm-mq/normalize_mq_topology.py
          python3 -m py_compile collectors/ibm-mq/_normalize_mq_observations_impl.py
          python3 -m py_compile collectors/ibm-mq/mq_cluster_semantics.py
          python3 -m py_compile collectors/ibm-mq/normalize_mq_observations.py

      - name: Help path
        run: |
          bash collectors/ibm-mq/mq-topology-collector.sh --help >/dev/null
          python3 collectors/ibm-mq/normalize_mq_topology.py --help >/dev/null
          python3 collectors/ibm-mq/normalize_mq_observations.py --help >/dev/null

      - name: Mocked archive integration test
        shell: bash
        run: |
          set -euo pipefail
          mockbin="$(mktemp -d)"
          outdir="$(mktemp -d)"

          cat > "$mockbin/dspmq" <<'EOF'
          #!/usr/bin/env bash
          echo 'QMNAME(QM_EXT) STATUS(Running)'
          echo 'QMNAME(QM_INT) STATUS(Running elsewhere)'
          EOF

          cat > "$mockbin/runmqsc" <<'EOF'
          #!/usr/bin/env bash
          qmgr="$1"
          echo "Starting MQSC for queue manager $qmgr."

          if [[ "$qmgr" == "QM_INT" ]]; then
            while IFS= read -r command; do
              echo "     1 : $command"
              echo 'AMQ8146E: IBM MQ queue manager not available.'
            done
            exit 0
          fi

          while IFS= read -r command; do
            echo "     1 : $command"
            case "$command" in
              'DISPLAY QMGR ALL')
                echo 'AMQ8408I: Display Queue Manager details.'
                echo '   QMNAME(QM_EXT) QMID(QMID-EXT-0001) PLATFORM(UNIX) CMDLEVEL(940) VERSION(09040000)'
                ;;
              'DISPLAY QMSTATUS ALL')
                echo 'AMQ8705I: Display Queue Manager Status Details.'
                echo '   QMNAME(QM_EXT) TYPE(QMGR) STATUS(RUNNING) CHINIT(RUNNING) CMDSERV(RUNNING) CONNS(1)'
                ;;
              'DISPLAY QLOCAL(*) ALL')
                echo 'AMQ8409I: Display Queue details.'
                echo '   QUEUE(APP.REQUEST) TYPE(QLOCAL) USAGE(NORMAL) PUT(ENABLED) GET(ENABLED)'
                echo 'AMQ8409I: Display Queue details.'
                echo '   QUEUE(XMIT.QM_REMOTE) TYPE(QLOCAL) USAGE(XMITQ) PUT(ENABLED) GET(ENABLED)'
                ;;
              'DISPLAY QREMOTE(*) ALL')
                echo 'AMQ8409I: Display Queue details.'
                echo '   QUEUE(REMOTE.REQUEST) TYPE(QREMOTE) RNAME(TARGET.Q) RQMNAME(QM_REMOTE) XMITQ(XMIT.QM_REMOTE)'
                ;;
              'DISPLAY QMODEL(*) ALL')
                echo 'AMQ8409I: Display Queue details.'
                echo '   QUEUE(SYSTEM.DEFAULT.MODEL.QUEUE) TYPE(QMODEL) PUT(ENABLED) GET(ENABLED)'
                ;;
              'DISPLAY QALIAS(*) ALL')
                echo 'AMQ8409I: Display Queue details.'
                echo '   QUEUE(APP.ALIAS) TYPE(QALIAS) TARGET(APP.REQUEST) PUT(ENABLED)'
                ;;
              'DISPLAY QCLUSTER(*) ALL')
                echo 'AMQ8147E: IBM MQ object * not found.'
                exit 10
                ;;
              'DISPLAY CHANNEL(*) ALL')
                echo 'AMQ8414I: Display Channel details.'
                echo '   CHANNEL(APP.QM_EXT) CHLTYPE(SVRCONN) MCAUSER(appuser)'
                echo 'AMQ8414I: Display Channel details.'
                echo '   CHANNEL(TO.QM_REMOTE) CHLTYPE(SDR) XMITQ(XMIT.QM_REMOTE) CONNAME(remote.example(1414)) TRPTYPE(TCP)'
                ;;
              'DISPLAY CHSTATUS(*) ALL')
                echo 'AMQ8417I: Display Channel Status details.'
                echo '   CHANNEL(TO.QM_REMOTE) CHLTYPE(SDR) STATUS(RUNNING) RQMNAME(QM_REMOTE) CONNAME(remote.example(1414))'
                ;;
              'DISPLAY CONN(*) TYPE(CONN) ALL')
                echo 'AMQ8276I: Display Connection details.'
                echo '   CONN(ABC123) TYPE(CONN) APPLTAG(MockApp) APPLTYPE(USER)'
                echo '   CHANNEL(APP.QM_EXT) CONNAME(10.0.0.10(55001)) USERID(appuser)'
                ;;
              'DISPLAY QSTATUS(*) TYPE(HANDLE) ALL')
                echo 'AMQ8450I: Display queue status details.'
                echo '   QUEUE(APP.REQUEST) TYPE(HANDLE) APPLTAG(MockApp) APPLTYPE(USER)'
                echo '   CHANNEL(APP.QM_EXT) CONNAME(10.0.0.10(55001)) INPUT(SHARED) OUTPUT(YES) USERID(appuser)'
                ;;
              'DISPLAY APSTATUS(*) ALL')
                echo 'AMQ8933I: Application status not found.'
                exit 10
                ;;
              'DISPLAY CLUSQMGR(*) ALL')
                echo 'AMQ8147E: IBM MQ object * not found.'
                exit 10
                ;;
            esac
          done
          EOF

          cat > "$mockbin/dspmqver" <<'EOF'
          #!/usr/bin/env bash
          echo 'Name: IBM MQ'
          echo 'Version: 9.4.0.0'
          EOF

          chmod +x "$mockbin"/*
          PATH="$mockbin:$PATH" bash collectors/ibm-mq/mq-topology-collector.sh 2 0 --output-dir "$outdir"

          archive="$(find "$outdir" -maxdepth 1 -name 'mq-topology-*.tar.gz' -print -quit)"
          test -n "$archive"

          listing="$(tar -tzf "$archive")"
          grep -q 'manifest.properties' <<<"$listing"
          grep -q 'qmgrs.tsv' <<<"$listing"
          grep -q 'qmgr/001_QM_EXT/config/channels.out' <<<"$listing"
          grep -q 'runtime/sample_001_.*connections.out' <<<"$listing"
          grep -q 'runtime/sample_002_.*connection-handles.out' <<<"$listing"

          # Legacy normalization remains supported during migration.
          python3 collectors/ibm-mq/normalize_mq_topology.py "$archive" -o "$outdir/normalized.json"
          python3 - "$outdir/normalized.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          ids={node['id'] for node in data['nodes']}
          assert len(ids)==len(data['nodes'])
          assert all(edge['source'] in ids and edge['target'] in ids for edge in data['edges'])

          qmgrs=[node for node in data['nodes'] if node['type']=='qmgr']
          assert {node['name'] for node in qmgrs} >= {'QM_EXT','QM_INT'}
          assert next(node for node in qmgrs if node['name']=='QM_EXT')['status']=='RUNNING'
          assert 'elsewhere' in next(node for node in qmgrs if node['name']=='QM_INT')['status'].lower()

          apps=[node for node in data['nodes'] if node['type']=='application' and node['name']=='MockApp']
          assert len(apps)==1, apps
          assert set(apps[0]['metadata']['observed_qmgrs'])=={'QM_EXT'}
          assert any(node['type']=='queue' and node['metadata'].get('queue_type')=='QMODEL' for node in data['nodes'])
          assert any(edge['relationship']=='CONSUMED_BY' for edge in data['edges'])
          PY

          # vNext direct normalization is the authoritative semantic path.
          python3 collectors/ibm-mq/normalize_mq_observations.py "$archive" -o "$outdir/observations.json"
          python3 - "$outdir/observations.json" services/core/registry/v1.json "$archive" <<'PY'
          import json, os, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          registry=json.load(open(sys.argv[2], encoding='utf-8'))
          archive_path=sys.argv[3]

          assert data['schema_version']=='osi.observation.bundle/v2'
          assert data['run']['source']['kind']=='ibm_mq_host'
          assert data['run']['artifact']['sha256']
          assert data['run']['normalizer_version']=='3.1.0', data['run']['normalizer_version']
          assert data['run']['metadata']['normalization_policy']=='latest-successful-runtime-sample-for-current-state'

          entities={item['ref']: item for item in data['entities']}
          assert len(entities)==len(data['entities'])
          assert all(rel['source_ref'] in entities and rel['target_ref'] in entities for rel in data['relations'])

          entity_defs={item['type']: item for item in registry['entities']}
          relation_defs={item['type']: item for item in registry['relationships']}
          for item in data['entities']:
              definition=entity_defs[item['semantic_type']]
              hints=item['identity']['hints']
              assert any(all(field in hints and str(hints[field]).strip() for field in rule['fields']) for rule in definition['identity']['rules']), item
          for rel in data['relations']:
              definition=relation_defs[rel['semantic_type']]
              assert entities[rel['source_ref']]['semantic_type'] in definition['source_types'], rel
              assert entities[rel['target_ref']]['semantic_type'] in definition['target_types'], rel
              assert rel['evidence_class'] in definition['evidence_classes'], rel

          qmgr=[e for e in data['entities'] if e['semantic_type']=='mq.queue_manager' and e['display_name']=='QM_EXT']
          assert any(e['identity']['hints'].get('qmid')=='QMID-EXT-0001' for e in qmgr), qmgr

          instances=[e for e in data['entities'] if e['semantic_type']=='mq.queue_manager_instance']
          roles={e['display_name']: e['properties'].get('runtime_role') for e in instances}
          assert roles['QM_EXT @ '+data['run']['source']['display_name']]=='active', roles
          assert roles['QM_INT @ '+data['run']['source']['display_name']]=='not_active', roles

          failed=[c for c in data['coverage'] if c['scope_type']=='queue_manager' and c['scope_key']=='QM_INT' and c['object_class']=='mq.queue_manager']
          assert len(failed)==1 and failed[0]['mode']=='failed', failed
          assert 'AMQ8146E' in failed[0].get('error',''), failed

          cluster_queue=[c for c in data['coverage'] if c['scope_type']=='queue_manager' and c['scope_key']=='QM_EXT' and c['object_class']=='relation:mq.cluster_discovers:queue']
          cluster_qmgr=[c for c in data['coverage'] if c['scope_type']=='queue_manager' and c['scope_key']=='QM_EXT' and c['object_class']=='relation:mq.cluster_discovers:queue_manager']
          for cluster, target_type in ((cluster_queue,'mq.queue'),(cluster_qmgr,'mq.queue_manager')):
              assert len(cluster)==1 and cluster[0]['mode']=='point_in_time', cluster
              assert cluster[0]['properties'].get('empty_result') is True, cluster
              assert cluster[0]['properties'].get('process_rc')==10, cluster
              assert cluster[0]['properties'].get('mq_message_codes')==['AMQ8147E'], cluster
              assert cluster[0]['properties'].get('absence_closes_assertions') is True, cluster
              assert cluster[0]['properties'].get('relationship_type')=='mq.cluster_discovers', cluster
              assert cluster[0]['properties'].get('target_type')==target_type, cluster

          reltypes={rel['semantic_type'] for rel in data['relations']}
          assert 'runtime.opens_for_output' in reltypes
          assert 'runtime.opens_for_input' in reltypes
          assert 'routing.routes_via' in reltypes
          assert 'routing.transmits_via' in reltypes
          assert 'network.connects_to' in reltypes
          assert not any(name.startswith('activity.') for name in reltypes), reltypes

          unresolved=[u for u in data['unresolved_references'] if u['reason']=='remote_queue_target_not_collected']
          assert len(unresolved)==1, unresolved
          assert unresolved[0]['vendor_value']=='QM_REMOTE:TARGET.Q'

          # A client socket is a network endpoint, not automatically a physical host.
          assert not any(e['semantic_type']=='infra.host' and e['display_name'].startswith('10.0.0.10') for e in data['entities'])
          assert any(e['semantic_type']=='infra.network_endpoint' and e['properties'].get('host')=='10.0.0.10' for e in data['entities'])

          selected=data['run']['metadata']['selected_runtime_samples']['QM_EXT']
          assert selected['connections'].startswith('sample_002_'), selected
          assert selected['queue-handles'].startswith('sample_002_'), selected
          assert selected['cluster-qmgrs'].startswith('sample_002_'), selected

          # Directly exercise the second real-estate empty form (AMQ8933I).
          sys.path.insert(0, os.path.join(os.getcwd(), 'collectors', 'ibm-mq'))
          import normalize_mq_observations as mqv2
          raw=mqv2.Archive(archive_path)
          samples=mqv2.runtime_samples(raw, '001_QM_EXT')
          assert samples, samples
          app_base=f'qmgr/001_QM_EXT/runtime/{samples[-1]}/application-status'
          app_health=mqv2.command_health(raw, app_base, 'point_in_time')
          assert app_health['mode']=='point_in_time', app_health
          assert app_health['properties'].get('empty_result') is True, app_health
          assert app_health['properties'].get('mq_message_codes')==['AMQ8933I'], app_health

          # Unknown/non-empty command failures must never be normalized as empty.
          int_qm=mqv2.command_health(raw, 'qmgr/002_QM_INT/config/qmgr', 'complete')
          assert int_qm['mode']=='failed', int_qm
          assert 'AMQ8146E' in int_qm.get('error',''), int_qm
          PY
