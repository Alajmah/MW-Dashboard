name: Semantic core check

on:
  pull_request:
    paths:
      - "services/core/**"
      - "contracts/v2/**"
      - ".github/workflows/core-check.yml"
  push:
    branches:
      - main
    paths:
      - "services/core/**"
      - "contracts/v2/**"
      - ".github/workflows/core-check.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mw
          POSTGRES_PASSWORD: mw
          POSTGRES_DB: mw
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mw -d mw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://mw:mw@localhost:5432/mw?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: services/core/go.mod

      - name: Validate JSON contracts
        run: |
          python3 -m json.tool contracts/v2/observation-bundle.schema.json >/dev/null
          python3 -m json.tool services/core/registry/v1.json >/dev/null

      - name: Download Go modules
        working-directory: services/core
        run: go mod download

      - name: Apply PostgreSQL schema
        working-directory: services/core
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0001_semantic_core.sql

      - name: Test semantic core
        working-directory: services/core
        run: go test ./...

      - name: Vet semantic core
        working-directory: services/core
        run: go vet ./...
