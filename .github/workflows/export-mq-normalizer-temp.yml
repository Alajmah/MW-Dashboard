name: Export MQ normalizer temp

on:
  push:
    branches:
      - vnext/mq-empty-result-classification

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Python modules
        run: |
          python3 -m py_compile collectors/ibm-mq/normalize_mq_topology.py
          python3 -m py_compile collectors/ibm-mq/_normalize_mq_observations_impl.py
          python3 -m py_compile collectors/ibm-mq/normalize_mq_observations.py

      - name: Package normalizer sources
        uses: actions/upload-artifact@v4
        with:
          name: mq-normalizer-private-fixture-test
          retention-days: 1
          path: |
            collectors/ibm-mq/normalize_mq_topology.py
            collectors/ibm-mq/_normalize_mq_observations_impl.py
            collectors/ibm-mq/normalize_mq_observations.py
            services/core/registry/v1.json
