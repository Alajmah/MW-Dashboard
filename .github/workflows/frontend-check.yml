name: Frontend check

on:
  pull_request:
    paths:
      - "public/**"
      - ".github/workflows/frontend-check.yml"
  push:
    branches:
      - main
    paths:
      - "public/**"
      - ".github/workflows/frontend-check.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: JavaScript syntax
        run: |
          for file in public/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: DOM contract
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          class IDs(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.append(attrs["id"])

          html = Path("public/index.html").read_text()
          js = "\n".join(path.read_text() for path in Path("public").glob("*.js"))
          parser = IDs()
          parser.feed(html)

          duplicates = sorted({item for item in parser.ids if parser.ids.count(item) > 1})
          if duplicates:
              raise SystemExit(f"duplicate HTML ids: {duplicates}")

          html_ids = set(parser.ids)
          referenced = set(re.findall(r'(?:\$|rq)\("([A-Za-z0-9_-]+)"\)', js))
          missing = sorted(referenced - html_ids)
          if missing:
              raise SystemExit(f"JavaScript references missing HTML ids: {missing}")

          print(f"DOM contract OK: {len(html_ids)} ids, {len(referenced)} referenced by frontend modules")

      - name: Readability contract
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path("public/index.html").read_text()
          css_path = Path("public/readability.css")
          if not css_path.exists() or not css_path.read_text().strip():
              raise SystemExit("public/readability.css is missing or empty")
          css = css_path.read_text()

          required = [
              'href="/readability.css"',
              'class="skip-link"',
              'id="mainContent"',
              '--muted-strong:',
              '--line-control:',
              ':focus-visible',
              'prefers-reduced-motion',
          ]
          missing = [item for item in required if item not in (html + "\n" + css)]
          if missing:
              raise SystemExit(f"readability contract missing: {missing}")

          sizes = [float(value) for value in re.findall(r'font-size:\s*([0-9.]+)px', css)]
          if not sizes or min(sizes) < 10:
              raise SystemExit(f"readability stylesheet contains operational font size below 10px: {min(sizes) if sizes else 'none'}")

          print(f"Readability contract OK: {len(sizes)} explicit font-size rules; minimum {min(sizes):g}px")
