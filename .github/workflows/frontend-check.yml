name: Frontend check

on:
  pull_request:
    paths:
      - "public/**"
      - ".github/workflows/frontend-check.yml"
  push:
    branches:
      - main
    paths:
      - "public/**"
      - ".github/workflows/frontend-check.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: JavaScript syntax
        run: |
          for file in public/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: DOM contract
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          class IDs(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.append(attrs["id"])

          html = Path("public/index.html").read_text()
          js = "\n".join(path.read_text() for path in Path("public").glob("*.js"))
          parser = IDs()
          parser.feed(html)

          duplicates = sorted({item for item in parser.ids if parser.ids.count(item) > 1})
          if duplicates:
              raise SystemExit(f"duplicate HTML ids: {duplicates}")

          html_ids = set(parser.ids)
          dynamic_ids = set(re.findall(r'(?:\bid|\.id)\s*=\s*["\']([A-Za-z0-9_-]+)["\']', js))
          dynamic_ids |= set(re.findall(r'id=\\?["\']([A-Za-z0-9_-]+)\\?["\']', js))
          referenced = set(re.findall(r'(?:\$|rq|iq|s\$|eq)\("([A-Za-z0-9_-]+)"\)', js))
          missing = sorted(referenced - html_ids - dynamic_ids)
          if missing:
              raise SystemExit(f"JavaScript references missing HTML/dynamic ids: {missing}")

          print(f"DOM contract OK: {len(html_ids)} HTML ids, {len(dynamic_ids)} dynamic ids, {len(referenced)} referenced by frontend modules")

      - name: Readability contract
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path("public/index.html").read_text()
          css_path = Path("public/readability.css")
          if not css_path.exists() or not css_path.read_text().strip():
              raise SystemExit("public/readability.css is missing or empty")
          css = css_path.read_text()

          required = [
              'href="/readability.css"',
              'class="skip-link"',
              'id="mainContent"',
              '--muted-strong:',
              '--line-control:',
              ':focus-visible',
              'prefers-reduced-motion',
          ]
          missing = [item for item in required if item not in (html + "\n" + css)]
          if missing:
              raise SystemExit(f"readability contract missing: {missing}")

          sizes = [float(value) for value in re.findall(r'font-size:\s*([0-9.]+)px', css)]
          if not sizes or min(sizes) < 10:
              raise SystemExit(f"readability stylesheet contains operational font size below 10px: {min(sizes) if sizes else 'none'}")

          print(f"Readability contract OK: {len(sizes)} explicit font-size rules; minimum {min(sizes):g}px")

      - name: Canonical Overview, Explore, and Routes contract
        shell: python
        run: |
          from pathlib import Path

          html = Path("public/index.html").read_text()
          shell = Path("public/shell.js").read_text()
          estate = Path("public/estate-ui.js").read_text()
          routes = Path("public/routes-estate.js").read_text()
          css = Path("public/estate-ui.css").read_text()
          required = [
              'href="/estate-ui.css"',
              'src="/shell.js"',
              'src="/estate-ui.js"',
              'data-view="inventory">Explore<',
              '/api/v2/estate/current/summary',
              '/api/v2/estate/current/entities',
              '/api/v2/routes/search',
              '/api/v2/routes/trace',
              'semantic_type',
              'identity_state',
              'next_offset',
              'Current / observed server',
              'Canonical semantic estate',
              'import("/app.js")',
              'import("/routes-estate.js")',
          ]
          combined = html + "\n" + shell + "\n" + estate + "\n" + routes + "\n" + css
          missing = [item for item in required if item not in combined]
          if missing:
              raise SystemExit(f"canonical estate UI contract missing: {missing}")

          # Canonical views must not eagerly execute legacy full-graph modules.
          forbidden_html = [
              'src="/app.js"',
              'src="/routes-v2.js"',
              'src="/inventory-v2.js"',
              'src="/inventory-v2-bridge.js"',
          ]
          present = [item for item in forbidden_html if item in html]
          if present:
              raise SystemExit(f"legacy full-graph modules are still eagerly loaded: {present}")
          if '/api/v1/topology/current' in shell or '/api/v1/topology/current' in estate or '/api/v1/topology/current' in routes:
              raise SystemExit("canonical shell must not fetch the legacy full graph for Overview, Explore, or Routes")
          print("Canonical Overview/Explore/Routes contract OK")

      - name: Semantic UX assets remain valid
        shell: python
        run: |
          from pathlib import Path

          semantic_files = sorted(Path("public").glob("semantic-*.js"))
          css = Path("public/semantic-ux.css")
          bridge = Path("public/inventory-v2-bridge.js").read_text()
          if not semantic_files or not css.exists():
              raise SystemExit("semantic UX assets are missing")
          text = "\n".join(path.read_text() for path in semantic_files) + "\n" + css.read_text() + "\n" + bridge
          required = [
              'import("/semantic-ux.js")',
              'Runtime coverage',
              'Evidence coverage',
              'Placement confirmed',
              'Middleware infrastructure',
              'Observed client hosts',
              'data-app-mode="logical"',
              'PAGE_SIZE=200',
              'Try a known route',
              'semantic-breadcrumb',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"semantic UX contract missing: {missing}")
          if 'slice(0,700)' in text.replace(' ', ''):
              raise SystemExit("semantic UX reintroduced the 700-object inventory cap")
          if 'function installObserver' in text:
              raise SystemExit("semantic UX must not use a broad global mutation observer")
          print(f"Semantic UX asset contract OK across {len(semantic_files)} JS modules")
