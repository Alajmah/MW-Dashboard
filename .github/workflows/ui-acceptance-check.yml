name: UI acceptance check

on:
  pull_request:
    paths:
      - "public/acceptance-ui.js"
      - "public/acceptance-ui.css"
      - "public/routes-estate.js"
      - "public/shell.js"
      - ".github/workflows/ui-acceptance-check.yml"
  push:
    branches:
      - main
    paths:
      - "public/acceptance-ui.js"
      - "public/acceptance-ui.css"
      - "public/routes-estate.js"
      - "public/shell.js"
      - ".github/workflows/ui-acceptance-check.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: JavaScript syntax
        run: node --check public/acceptance-ui.js && node --check public/routes-estate.js && node --check public/shell.js

      - name: Screenshot acceptance contract
        shell: python
        run: |
          from pathlib import Path

          shell = Path("public/shell.js").read_text()
          js = Path("public/acceptance-ui.js").read_text()
          routes = Path("public/routes-estate.js").read_text()
          css = Path("public/acceptance-ui.css").read_text()
          combined = shell + "\n" + js + "\n" + routes + "\n" + css

          required = [
              'import "/acceptance-ui.js?v=',
              'UI_ASSET_REVISION',
              'import(`/routes-estate.js?v=${UI_ASSET_REVISION}`)',
              'aria-autocomplete',
              'ArrowDown',
              'ArrowUp',
              'Escape',
              'keyboard-active',
              'single-host-overview',
              '#view-overview .section-block.two-col',
              '.route-suggestion.keyboard-active',
              '↑/↓ navigate · Enter select · Esc close',
              'subtree: false',
              'resultsReplaced',
              'AbortController',
              'search.sequence',
              'input.value.trim() !== normalized',
              'Focus alone never reopens cached results',
              '#view-routes .route-workbench:focus-within',
              '#view-routes .route-suggestions.open{z-index:1000',
              '#view-routes .route-results-v2{position:relative;z-index:1',
              'function routeSearchMatch',
              'query.length < 4',
              'matched canonical identity',
              'limit=50',
              'No visible route endpoint names match this search',
          ]
          missing = [item for item in required if item not in combined]
          if missing:
              raise SystemExit(f"UI acceptance contract missing: {missing}")

          if '/api/v1/topology/current' in js:
              raise SystemExit("acceptance UI must not reintroduce legacy full-graph loading")

          dangerous = 'observer.observe(results, { childList: true, subtree: true, attributes: true'
          if dangerous in js:
              raise SystemExit("route combobox must not observe descendant class mutations; this causes a MutationObserver feedback loop")

          stale_focus = 'if (results.innerHTML.trim()) results.classList.add("open")'
          if stale_focus in routes:
              raise SystemExit("route picker must not reopen cached suggestions on focus")

          if '#view-routes .route-workbench{position:relative!important;overflow:visible!important' not in css:
              raise SystemExit("route workbench must own an overflow-visible stacking context")

          print("UI acceptance contract OK")
