name: Operator path domain check

on:
  pull_request:
    paths:
      - "src/bootstrap.ts"
      - "src/operator-path-domains.ts"
      - "src/operator-read-model.ts"
      - "src/integrated-routes.ts"
      - "scripts/seed-canonical-routes-ci.sql"
      - "migrations/**"
      - ".github/workflows/operator-path-domain-check.yml"
  push:
    branches:
      - main
    paths:
      - "src/bootstrap.ts"
      - "src/operator-path-domains.ts"
      - "src/operator-read-model.ts"
      - "src/integrated-routes.ts"
      - "scripts/seed-canonical-routes-ci.sql"
      - "migrations/**"
      - ".github/workflows/operator-path-domain-check.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: npm install

      - name: Type check Worker
        run: npm run check

      - name: Apply local D1 migrations
        run: npm run db:migrate:local

      - name: Seed canonical route fixture
        run: npx wrangler d1 execute DB --local --file=scripts/seed-canonical-routes-ci.sql

      - name: Start local Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --port 8787 --var ADMIN_IMPORT_TOKEN:ci-token > /tmp/wrangler-operator-paths.log 2>&1 &
          echo $! > /tmp/wrangler-operator-paths.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wrangler-operator-paths.log
          exit 1

      - name: Verify multi-domain operator paths
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent 'http://127.0.0.1:8787/api/v2/operator/paths?limit=25&offset=0' > /tmp/operator-paths.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/operator-paths.json'))
          assert data['schema_version'] == 'osi.operator.paths/v2'
          assert data['page']['total'] == 2
          paths=data['paths']
          assert [p['domain'] for p in paths] == ['messaging','file_transfer']

          messaging=next(p for p in paths if p['domain']=='messaging')
          assert messaging['qualification']['qualified'] is True
          assert messaging['qualification']['epistemic'] == 'derived'
          assert messaging['runtime_boundary'] == 'current'
          assert messaging['outcome'] == 'not_established'
          assert messaging['outcome_label'] == 'Message traversal not established'
          assert [n['role'] for n in messaging['nodes']] == [
              'DataPower service','Static route','MQ boundary','MQ queue'
          ]
          assert messaging['nodes'][2]['state'] == 'Corroborated'
          assert messaging['nodes'][3]['state'] == 'Configured target'
          assert any(x['label']=='Message outcome' and x['state']=='not established' for x in messaging['evidence'])
          assert any('do not prove PUT, GET' in x['detail'] for x in messaging['evidence'])

          ftp=next(p for p in paths if p['domain']=='file_transfer')
          assert ftp['qualification']['epistemic'] == 'inferred'
          assert ftp['runtime_boundary'] == 'current'
          assert ftp['outcome'] == 'not_observed'
          assert ftp['outcome_label'] == 'Completed transfer not observed'
          assert [n['role'] for n in ftp['nodes']] == [
              'Access context','DMZ listener','PNC boundary','EFT Site'
          ]
          assert ftp['nodes'][0]['state'] == 'Historical'
          assert ftp['nodes'][2]['state'] == 'Corroborated'
          print('Multi-domain operator path projection OK')
          PY

      - name: Verify Operations uses the same bounded path projection
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent 'http://127.0.0.1:8787/api/v2/operator/overview' > /tmp/operator-overview.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/operator-overview.json'))
          assert data['schema_version'] == 'osi.operator.overview/v2'
          assert data['paths']['total'] == 2
          assert len(data['paths']['items']) == 2
          assert {p['domain'] for p in data['paths']['items']} == {'messaging','file_transfer'}
          assert all('outcome_label' in p for p in data['paths']['items'])
          print('Operations multi-domain path summary OK')
          PY

      - name: Stop local Worker
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/wrangler-operator-paths.pid ]]; then kill "$(cat /tmp/wrangler-operator-paths.pid)" || true; fi
          tail -120 /tmp/wrangler-operator-paths.log || true
